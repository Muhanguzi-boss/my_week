name: my_week
description: My Week - a weekly class planner with clash detection, Firebase login and live Firestore data.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  # firebase_core, firebase_auth and cloud_firestore are added by
  # `flutter pub add` (see README, setup step 3)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
